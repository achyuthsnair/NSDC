<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body style="background-color: black; color: gray;">
    <h1 style="color: white;">Student Registration</h1>
    <h6 style="color: aliceblue;">Sample desgin reference</h6>
    <div style="background-color: white; width: 75%;">
    <form >
        <br><br>
        <label>Full Name</label><br><br>
        <input type="text" placeholder="Enter your full name" required><br><br>
        <label>Email</label><br><br>
        <input type="email" placeholder="Enter your email" required><br><br>
        <label>Gender</label><br><br>

        <input type="radio" name="Gender" value="Male">
        <label>Male</label> &nbsp;
        <input type="radio" name="Gender" value="Female">
        <label>Female</label><br><br>

        <label> Skills</label><br>
        <select name="course" required>
            <option name="course" value = "course_needed">Select Course</option>
            <option name="course" value = "Java">Java</option>
            <option name="course" value = "Python">Python</option>
            <option name="course" value = "Web">Web</option>
        </select>
        <br><br>
        <label>City</label><br><br>
        <textarea name="City" placeholder="Enter City Name " cols = "41" required  rows = '15'></textarea><br>
        <br><br>
        <input style="background-color: rgb(0, 255, 17); color :white; display: block; margin: 0 auto"  type="Submit">
        <br><br><br>


    </form>
    </div>
</body>
